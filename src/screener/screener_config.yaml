# ============================================================
# Screener Configuration — 6 Preset Filters + Custom Thresholds
# Sprint 3 · Day 15
#
# Each preset has a name and description for UI display.
# All filters support custom threshold override via CLI/API.
# ============================================================

# ============================================================
# Section 1: Metric Definitions
# ============================================================
metrics:
  roe_min:
    name: Return on Equity (%)
    description: Minimum annual ROE percentage
    data_type: percentage
    table: financial_ratios
    column: return_on_equity_pct
    default_threshold: 12.0
    direction: higher_is_better

  de_max:
    name: Debt-to-Equity
    description: Maximum D/E ratio (skip Financials sector)
    data_type: ratio
    table: financial_ratios
    column: debt_to_equity
    default_threshold: 1.0
    direction: lower_is_better
    special_handling: financials_sector_skip

  fcf_min:
    name: Free Cash Flow (₹Cr)
    description: Minimum free cash flow in crores
    data_type: currency
    table: financial_ratios
    column: free_cash_flow_cr
    default_threshold: 50.0
    direction: higher_is_better

  revenue_cagr_5yr_min:
    name: Revenue CAGR 5Y (%)
    description: Minimum 5-year revenue CAGR
    data_type: percentage
    table: financial_ratios
    column: revenue_cagr_5yr
    default_threshold: 10.0
    direction: higher_is_better

  pat_cagr_5yr_min:
    name: PAT CAGR 5Y (%)
    description: Minimum 5-year PAT (net profit) CAGR
    data_type: percentage
    table: financial_ratios
    column: pat_cagr_5yr
    default_threshold: 15.0
    direction: higher_is_better

  opm_min:
    name: Operating Profit Margin (%)
    description: Minimum operating profit margin
    data_type: percentage
    table: financial_ratios
    column: operating_profit_margin_pct
    default_threshold: 10.0
    direction: higher_is_better

  pe_max:
    name: P/E Ratio
    description: Maximum price-to-earnings ratio
    data_type: ratio
    table: market_cap
    column: pe_ratio
    default_threshold: 25.0
    direction: lower_is_better

  pb_max:
    name: P/B Ratio
    description: Maximum price-to-book ratio
    data_type: ratio
    table: market_cap
    column: pb_ratio
    default_threshold: 3.0
    direction: lower_is_better

  dividend_yield_min:
    name: Dividend Yield (%)
    description: Minimum dividend yield percentage
    data_type: percentage
    table: market_cap
    column: dividend_yield_pct
    default_threshold: 2.0
    direction: higher_is_better

  icr_min:
    name: Interest Coverage Ratio
    description: Minimum interest coverage ratio (Debt Free = infinity)
    data_type: ratio
    table: financial_ratios
    column: interest_coverage
    default_threshold: 2.5
    direction: higher_is_better
    special_handling: debt_free_as_infinity

  market_cap_min:
    name: Market Cap (₹Cr)
    description: Minimum market capitalization in crores
    data_type: currency
    table: market_cap
    column: market_cap_crore
    default_threshold: 5000.0
    direction: higher_is_better

  net_profit_min:
    name: Net Profit (₹Cr)
    description: Minimum net profit in crores
    data_type: currency
    table: profitandloss
    column: net_profit
    default_threshold: 100.0
    direction: higher_is_better

  eps_cagr_min:
    name: EPS CAGR 5Y (%)
    description: Minimum 5-year EPS CAGR
    data_type: percentage
    table: financial_ratios
    column: eps_cagr_5yr
    default_threshold: 12.0
    direction: higher_is_better

  asset_turnover_min:
    name: Asset Turnover
    description: Minimum asset turnover ratio
    data_type: ratio
    table: financial_ratios
    column: asset_turnover
    default_threshold: 0.5
    direction: higher_is_better

  dividend_payout_max:
    name: Dividend Payout Ratio (%)
    description: Maximum dividend payout ratio as percentage
    data_type: percentage
    table: financial_ratios
    column: dividend_payout_ratio_pct
    default_threshold: 80.0
    direction: lower_is_better

  revenue_cagr_3yr_min:
    name: Revenue CAGR 3Y (%)
    description: Minimum 3-year revenue CAGR
    data_type: percentage
    table: financial_ratios
    column: revenue_cagr_3yr
    default_threshold: 10.0
    direction: higher_is_better

  de_near_zero:
    name: Debt-to-Equity (near zero)
    description: D/E near zero for debt-free screening (all sectors)
    data_type: ratio
    table: financial_ratios
    column: debt_to_equity
    default_threshold: 0.01
    direction: lower_is_better

  sales_min:
    name: Sales (₹Cr)
    description: Minimum annual sales/revenue in crores
    data_type: currency
    table: profitandloss
    column: sales
    default_threshold: 5000.0
    direction: higher_is_better

  de_yoy_change_pct_min:
    name: D/E YoY Change (%)
    description: Minimum year-over-year D/E decline (positive = improving)
    data_type: percentage
    table: financial_ratios
    column: de_yoy_change_pct
    default_threshold: 0.0
    direction: higher_is_better


# ============================================================
# Section 2: Preset Filters (6 templates for common use cases)
# ============================================================
presets:
  quality_compounder:
    name: "Quality Compounder"
    description: "High-quality companies with ROE > 15%, low leverage, positive FCF, and consistent revenue growth"
    filters:
      roe_min: 15.0
      de_max: 1.0
      fcf_min: 0.1
      revenue_cagr_5yr_min: 10.0
    ranking_metric: roe_min

  value_pick:
    name: "Value Pick"
    description: "Undervalued stocks with reasonable P/E, P/B, and dividend income potential"
    filters:
      pe_max: 35.0
      pb_max: 3.0
      de_max: 2.0
      dividend_yield_min: 1.0
    ranking_metric: pe_max

  growth_accelerator:
    name: "Growth Accelerator"
    description: "High-growth companies with accelerating profit growth and controlled leverage"
    filters:
      pat_cagr_5yr_min: 20.0
      revenue_cagr_5yr_min: 15.0
      de_max: 2.0
    ranking_metric: pat_cagr_5yr_min

  dividend_champion:
    name: "Dividend Champion"
    description: "Consistent dividend payers with positive cash flow and sustainable payout ratio"
    filters:
      dividend_yield_min: 2.0
      dividend_payout_max: 80.0
      fcf_min: 0.1
    ranking_metric: dividend_yield_min

  debt_free_blue_chip:
    name: "Debt-Free Blue Chip"
    description: "Zero-debt companies with strong ROE and significant scale"
    filters:
      de_near_zero: 0.01
      roe_min: 12.0
      sales_min: 5000.0
    ranking_metric: roe_min

  turnaround_watch:
    name: "Turnaround Watch"
    description: "Emerging recovery candidates with improving revenue, positive FCF, and declining leverage"
    filters:
      revenue_cagr_3yr_min: 10.0
      fcf_min: 0.1
      de_yoy_change_pct_min: 0.0
    ranking_metric: revenue_cagr_3yr_min
